[env:rlcd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.embed_files =
    fonts/AveriaSerifLibre-Regular.ttf
    fonts/AveriaSerifLibre-Bold.ttf
    fonts/AveriaSerifLibre-Italic.ttf
    fonts/AveriaSerifLibre-BoldItalic.ttf
    fonts/Quicksand-Regular.ttf
    fonts/Quicksand-Bold.ttf
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Os
lib_deps =
    olikraus/U8g2@^2.36.18
    h2zero/NimBLE-Arduino@^2.3.0
