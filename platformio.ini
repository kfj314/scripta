[platformio]
default_envs = rlcd

; Settings shared by every board
[common]
; pinned: "stable" moved to 61.x (Arduino core 4.0), which NimBLE-Arduino 2.5.x does not build on
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.embed_files =
    fonts/AveriaSerifLibre-Regular.ttf
    fonts/AveriaSerifLibre-Bold.ttf
    fonts/AveriaSerifLibre-Italic.ttf
    fonts/AveriaSerifLibre-BoldItalic.ttf
    fonts/Quicksand-Regular.ttf
    fonts/Quicksand-Bold.ttf
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -Os
lib_deps =
    olikraus/U8g2@^2.36.18
    ; pinned: 2.5.2 fails to compile (ble_npl_event has no member 'event')
    h2zero/NimBLE-Arduino@2.5.1

; ---- Boards -------------------------------------------------------------------
; Each board is a folder in boards/ holding board.h (pins, panel size, features)
; plus its display and power code. Everything in src/ is shared.
;   python -m platformio run -e rlcd -t upload
;   python -m platformio run -e epd397 -t upload

; Waveshare ESP32-S3-RLCD-4.2 (400x300 reflective LCD)
[env:rlcd]
extends = common
build_flags =
    ${common.build_flags}
    -Iboards/rlcd42
build_src_filter = +<*> +<../boards/rlcd42/>

; Waveshare ESP32-S3-ePaper-3.97 (800x480 e-paper)
[env:epd397]
extends = common
build_flags =
    ${common.build_flags}
    -Iboards/epd397
build_src_filter = +<*> +<../boards/epd397/>
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib@^0.2.7
